</style><defs><marker id="m10b981" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#10b981"/></marker><marker id="m3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#3b82f6"/></marker><marker id="ma855f7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#a855f7"/></marker><marker id="mef4444" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0L10,5L0,10z" fill="#ef4444"/></marker></defs><rect x="-15" y="-5" width="670" height="320" rx="10" fill="#ffffff"/><line class="arr" x1="40" y1="200" x2="360" y2="200"/><line class="arr" x1="200" y1="290" x2="200" y2="30"/><line x1="200" y1="200" x2="320" y2="160" stroke="#ef4444" stroke-width="3" marker-end="url(#mef4444)"/><text class="th" x="325" y="165">a=(3,1)</text><line x1="200" y1="200" x2="280" y2="120" stroke="#10b981" stroke-width="3" marker-end="url(#m10b981)"/><text class="t" x="285" y="115">b=(2,2)</text><line x1="200" y1="200" x2="160" y2="80" stroke="#3b82f6" stroke-width="3" marker-end="url(#m3b82f6)"/><text class="t" x="110" y="72">c=(-1,3)</text><line x1="200" y1="200" x2="80" y2="240" stroke="#a855f7" stroke-width="3" marker-end="url(#ma855f7)"/><text class="t" x="30" y="260">d=(-3,-1)</text><text class="th" x="390" y="60">a와 내적하면</text><text class="t" x="390" y="95">a·b = 3·2+1·2 = 8</text><text class="ts" x="390" y="113">비슷한 방향 → 큼 (cos≈0.89)</text><text class="t" x="390" y="148">a·c = −3+3 = 0</text><text class="ts" x="390" y="166">직각 → 0 (무관)</text><text class="t" x="390" y="201">a·d = −9−1 = −10</text><text class="ts" x="390" y="219">반대 방향 → 음수 (cos=−1)</text></svg>