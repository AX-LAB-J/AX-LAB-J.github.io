<svg viewBox="-15 -5 690 250" width="690" height="250" xmlns="http://www.w3.org/2000/svg"><style>
text{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;fill:#1f2937;white-space:pre}
.t{font-size:14px}.ts{font-size:12px;fill:#4b5563}.th{font-size:14px;font-weight:600;fill:#111827}
.arr{stroke:#6b7280;stroke-width:1.5;fill:none}
.c-gray{fill:#e5e7eb}.c-teal{fill:#99f6e4}.c-coral{fill:#fecaca}.c-blue{fill:#bfdbfe}.c-amber{fill:#fde68a}
g.c-blue rect{fill:#dbeafe;stroke:#3b82f6}g.c-coral rect{fill:#fee2e2;stroke:#ef4444}
g.c-gray rect{fill:#f3f4f6;stroke:#9ca3af}g.c-teal rect{fill:#ccfbf1;stroke:#14b8a6}g.c-amber rect{fill:#fef3c7;stroke:#f59e0b}
g[class^=c-] text{fill:#111827}
</style><defs></defs><rect x="-15" y="-5" width="690" height="250" rx="10" fill="#ffffff"/><text class="th" x="20" y="30">A x 계산: 행 하나 · 벡터 = 결과 칸 하나</text><rect class="c-coral" x="40" y="60" width="100" height="40" rx="6" opacity="0.6"/><rect class="c-blue" x="40" y="110" width="100" height="40" rx="6" opacity="0.6"/><text class="th" x="60" y="86">2    1</text><text class="th" x="60" y="136">0    1</text><text class="ts" x="60" y="175">A</text><text class="th" x="155" y="112">×</text><rect class="c-gray" x="180" y="60" width="50" height="90" rx="6" opacity="0.5"/><text class="th" x="198" y="86">1</text><text class="th" x="198" y="136">1</text><text class="ts" x="195" y="175">x</text><text class="th" x="245" y="112">=</text><rect class="c-coral" x="270" y="60" width="50" height="40" rx="6" opacity="0.6"/><rect class="c-blue" x="270" y="110" width="50" height="40" rx="6" opacity="0.6"/><text class="th" x="288" y="86">3</text><text class="th" x="288" y="136">1</text><text class="t" x="350" y="86">1행: 2·1 + 1·1 = 3</text><text class="t" x="350" y="136">2행: 0·1 + 1·1 = 1</text><text class="ts" x="40" y="210">같은 색끼리: A의 그 행과 x를 내적하면 결과의 그 칸이 나와요</text></svg>